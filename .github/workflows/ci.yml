name: K3 Pilot CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: k3-pilot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  agent-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify read-only observer and manual Codex approval gate
        run: node --test tests/agent-observer.test.mjs tests/codex-task-gate.test.mjs
  portfolio-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Validate existing repository lint
        if: steps.install.outcome == 'success'
        run: npm run lint
      - name: Validate existing static export suite
        if: always() && steps.install.outcome == 'success'
        run: npm test
